server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SPA fallback: client-side routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
