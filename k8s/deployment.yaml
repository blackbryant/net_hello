apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-blazor
  labels:
    app: hello-blazor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-blazor
  template:
    metadata:
      labels:
        app: hello-blazor
    spec:
      containers:
        - name: hello-blazor
          # 改成你的 registry/映像名稱
          image: 172.19.54.234:8082/test/net-hello:v2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
